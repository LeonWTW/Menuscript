# This XcodeGen manifest is the single source of truth for the generated Xcode project.
# Keeping build settings here makes every developer regenerate the same app and test targets.
name: Menuscript

# These shared values define the bundle namespace, source language, and oldest supported iOS version.
options:
  bundleIdPrefix: com.leonwong
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"

# Project-wide compiler and release settings keep both targets on the same Swift toolchain and version.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

# The application target packages the client-only app; the test target runs against that built app.
targets:
  Menuscript:
    type: application
    platform: iOS
    sources:
      - path: Menuscript
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "用相機拍攝菜單相作辨識翻譯。真實模式會將所拍菜單相傳送至 Google Gemini；示範模式只會喺裝置本機處理。"
        NSPhotoLibraryUsageDescription: "選取菜單相作辨識翻譯。真實模式會將所選菜單相傳送至 Google Gemini；示範模式只會喺裝置本機處理。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonwong.menuscript
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MenuscriptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MenuscriptTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonwong.menuscripttests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Menuscript.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Menuscript"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Menuscript
