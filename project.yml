name: MenuTranslate

options:
  bundleIdPrefix: com.leonwong
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MenuTranslate:
    type: application
    platform: iOS
    sources:
      - path: MenuTranslate
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "影菜單用嚟辨識翻譯"
        NSPhotoLibraryUsageDescription: "揀菜單相用嚟辨識翻譯"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonwong.menutranslate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MenuTranslateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MenuTranslateTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonwong.menutranslatetests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MenuTranslate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MenuTranslate"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MenuTranslate
